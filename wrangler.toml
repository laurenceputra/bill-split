name = "bill-split"
account_id = "ef5da8772e934578524c5b4bf80d3e4b"
main = "src/worker/index.ts"
compatibility_date = "2025-08-01"

# Keep traces useful without making a small production workload expensive.
# Invocation logs remain enabled for the structured, intentionally PII-free
# application logs emitted by the Worker.
[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
head_sampling_rate = 0.1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "bill-split"
database_id = "625080f5-ce8d-45a3-9a65-ed264dbf25c3"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
# Configure CLERK_PUBLISHABLE_KEY, CLERK_JWT_KEY, and
# CLERK_AUTHORIZED_PARTIES as production Worker variables; set the required
# CLERK_SECRET_KEY and IDENTITY_TOMBSTONE_KEY as encrypted secrets with
# `wrangler secret put`. IDENTITY_TOMBSTONE_KEY must be stable and must not be
# derived from or rotated with a Clerk secret.
# R2 is optional: add an [[r2_buckets]] binding named RECEIPTS when enabled.

# Native Cloudflare rate limiting for authenticated high-risk operations. The
# namespace IDs are account-scoped and intentionally distinct from the local
# development namespace below. Five calls per user and operation bucket per
# minute is deliberately conservative for this private application.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "510001"

  [ratelimits.simple]
  limit = 5
  period = 60

[triggers]
crons = ["*/15 * * * *"]

[[routes]]
pattern = "billsplit.laurenceputra.com"
custom_domain = true

[env.dev]
name = "bill-split-dev"

[[env.dev.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "510002"

  [env.dev.ratelimits.simple]
  limit = 5
  period = 60

[[env.dev.d1_databases]]
binding = "DB"
# This is deliberately not the production database ID. Local Wrangler D1 uses
# the binding name and --persist-to directory for E2E data; the placeholder
# keeps an accidental `wrangler deploy --env dev` from targeting production.
database_name = "bill-split"
database_id = "00000000-0000-4000-8000-000000000001"
migrations_dir = "migrations"

[env.dev.vars]
ENVIRONMENT = "development"
# Explicit deterministic local-only fallback; never use this value in production.
IDENTITY_TOMBSTONE_KEY = "billsplit-development-identity-tombstone-key-v1"
# Local development only. Do not use this environment for a public hostname.
