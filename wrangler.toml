name = "bill-split-local"
main = "src/worker/index.ts"
compatibility_date = "2025-08-01"
# This file is intentionally local-only. Use wrangler.deploy.toml for any
# Cloudflare deployment; it is ignored and must be created from the example.
workers_dev = false

# Keep local traces useful without making development noisy.
# Invocation logs remain enabled for the structured, intentionally PII-free
# application logs emitted by the Worker.
[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
head_sampling_rate = 0.1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "bill-split"
# A local-only placeholder. Wrangler uses the local D1 state for this config.
database_id = "00000000-0000-4000-8000-000000000000"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "development"
# No production Clerk values or resources belong in this config.

[env.dev]
name = "bill-split-dev"

[[env.dev.d1_databases]]
binding = "DB"
# This is deliberately not the production database ID. Local Wrangler D1 uses
# the binding name and --persist-to directory for E2E data; the placeholder
# keeps an accidental `wrangler deploy --env dev` from targeting production.
database_name = "bill-split"
database_id = "00000000-0000-4000-8000-000000000001"
migrations_dir = "migrations"

[env.dev.vars]
ENVIRONMENT = "development"
# Local development only. Do not use this environment for a public hostname.
# Development intentionally has no rate-limit resource; the Worker bypasses
# rate limiting only for this exact local environment.
