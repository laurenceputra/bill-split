name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  service-worker-lifecycle:
    name: Real service-worker A/B lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/e2e/fixtures/update-playwright.config.ts
      - name: Upload update lifecycle failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-worker-lifecycle-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn

  unit-and-build:
    name: Fast unit and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build

  d1-integration:
    name: Local D1 integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  date-controls:
    name: Date controls (${{ matrix.project }})
    runs-on: ubuntu-latest
    # Mitigation experiment, not a root-cause fix: isolate each browser's
    # Wrangler server and local D1 after shared-server connection failures.
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: date-controls-webkit
            browser: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- tests/e2e/date-controls.spec.ts --project=${{ matrix.project }} --workers=1
        env:
          WRANGLER_LOG_PATH: wrangler-logs/
      - name: Upload date-control failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: date-controls-diagnostics-${{ matrix.project }}
          path: |
            wrangler-logs/
            test-results/
            playwright-report/
          if-no-files-found: warn
